version: "2"

run:
  # Pinned above the go.mod directive (1.22): at language version 1.22
  # staticcheck fails to model t.Fatal as terminating and reports false
  # SA5011 nil-dereference warnings in tests. Genuine SA5011 hits are
  # still reported at this version.
  go: "1.23"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gocritic
    - gocyclo
    - revive
  settings:
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - errcheck
        path: examples/

formatters:
  enable:
    - gofmt
    - goimports
