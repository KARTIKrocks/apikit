# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration for apikit (github.com/KARTIKrocks/apikit)
# Docs: https://docs.coderabbit.ai/reference/configuration
language: en-US
early_access: false

reviews:
  # "assertive" surfaces more substantive feedback than the default "chill".
  # Good for a library where API quality and correctness matter.
  profile: assertive

  # Don't block merges; CI (vet/lint/test) is the gate. CodeRabbit advises.
  request_changes_workflow: false

  high_level_summary: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  poem: true

  # Report review status as a GitHub commit status, but never fail the build.
  review_status: true
  commit_status: true
  fail_commit_status: false

  suggested_reviewers: true
  suggested_labels: true
  auto_apply_labels: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - main
    # Skip release/automation PRs that don't need a human-style review.
    ignore_title_keywords:
      - "wip"
      - "release"
    ignore_usernames:
      - "dependabot[bot]"

  # Let the bot offer docstrings and test scaffolding, but not auto-simplify.
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

  # Exclude noise from review scope. CodeRabbit still has full repo context.
  path_filters:
    - "!**/*.pb.go"
    - "!**/mock_*.go"
    - "!**/*_mock.go"
    - "!**/testdata/**"
    - "!**/CHANGELOG.md"
    - "!**/go.sum"
    - "!**/vendor/**"

  # Package-aware guidance so reviews match this library's conventions.
  path_instructions:
    - path: "**/*.go"
      instructions: >-
        Idiomatic Go review. Verify errors are wrapped with %w and never
        silently ignored. Check that exported identifiers have doc comments
        starting with the identifier name. Flag goroutine leaks, missing
        context.Context propagation, unclosed resources (Body/rows/files),
        and data races on shared state. Prefer the standard library and
        avoid new third-party dependencies in the core module (github.com/
        KARTIKrocks/apikit's own go.mod). This does not apply to otel/, a
        separate Go module with its own go.mod that exists specifically to
        add a real third-party dependency — see its own instructions below.
    - path: "**/*_test.go"
      instructions: >-
        Prefer table-driven tests and t.Parallel() where safe. Tests must be
        deterministic and run cleanly under -race. Use t.Cleanup for teardown.
        Flag assertions that don't actually test behavior.
    - path: "httpclient/**"
      instructions: >-
        Scrutinize timeout/retry/backoff handling, response body closing,
        and propagation of non-2xx status errors. Ensure context cancellation
        is honored on every request path.
    - path: "router/**/*.go"
      instructions: >-
        Check middleware ordering, panic recovery, and CORS/preflight
        handling. Confirm unmatched routes and error paths are covered.
    - path: "examples/**"
      instructions: >-
        Examples are illustrative; relax error-handling strictness but ensure
        they compile and demonstrate correct API usage.
    - path: "openapi/**"
      instructions: >-
        Schema generation reflects on the same json/validate struct tags
        request.Bind[T]/request.ValidateStruct use — keep the two consistent
        rather than reinventing tag parsing here. Document caches its
        rendered JSON (document.go: the cache field), invalidated only by
        Add/Sync explicitly clearing it; flag any new Document mutator that
        doesn't also clear the cache, or a served spec goes stale after the
        first request following that change. Schema.MarshalJSON encodes a
        nullable $ref as {"anyOf": [{"$ref":...},{"type":"null"}]} rather than
        a sibling "type" next to "$ref" (which OpenAPI tooling doesn't
        reliably honor) — a real bug caught in this package's initial review;
        don't "simplify" that branch away. Importing router/ here (for
        Document.Sync) is intentional, not a decoupling violation.
    - path: "otel/**"
      instructions: >-
        This is a separate Go module (its own go.mod/go.sum, tagged
        independently as otel/vX.Y.Z) specifically so real OpenTelemetry
        dependencies never reach the core module — do not flag
        go.opentelemetry.io/otel imports or go.mod entries as an unwanted
        dependency here. Span/metric names must stay low-cardinality: they
        come from the matched route pattern (r.Pattern), not the raw request
        path, and r.Pattern for a method-specific route already includes the
        method (e.g. "GET /users/{id}") — code that does `r.Method + " " +
        r.Pattern` unconditionally reintroduces a real double-prefix bug this
        module's own tests caught before its first release. OpenTelemetry's
        global TracerProvider/MeterProvider/propagator default to no-ops by
        design; if propagation "isn't working" in a test or example, the fix
        is a missing WithPropagator(...)/otel.SetTextMapPropagator(...) at
        the call site, not a change to that default. Note: CI lints this
        module with its own otel/.golangci.yml (no go-version pin, unlike the
        root config referenced below), so a golangci-lint finding here from
        the tools integration may not match what CI actually enforces.

  tools:
    # Reuse the repo's existing golangci-lint v2 ruleset; no duplication.
    golangci-lint:
      enabled: true
      config_file: .golangci.yml
    # Secret scanning on every PR.
    gitleaks:
      enabled: true
    # Lint GitHub Actions workflows and Markdown docs.
    actionlint:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  # Learn this repo's review patterns over time and pull in linked issues/PRs.
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
  web_search:
    enabled: true
